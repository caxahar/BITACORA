  <path d="M 222,286 L 246,312 L 292,262" fill="none" stroke="#FFFFFF" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 222,286 L 246,312 L 292,262" fill="none" stroke="#28C76F" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
