<script>
/* ============================================================
   CONFIG — pega acá la URL /exec de tu deploy de Apps Script
   (Implementar > Nueva implementación > Aplicación web > Acceso: Cualquier persona)
   ============================================================ */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby5KLvG9mzOch9TIYAClWamPc_xc8xmD8c6k2TVbPf1symiaagG20_FOoazB7Tyqne2/exec";

const DAY = ['🅳','🅻','🅼','🆆','🅹','🆅','🆂'];
const DAY_FULL = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const PALETTE = ['#58CC02','#3B82F6','#A855F7','#F59E0B','#EC4899','#14B8A6','#F97316','#6366F1'];
let HABIT_COLORS = {};

let STATE = { data:null, tab:0, chartMode:'total', calMonthOffset:0, pendingLog:null, pendingQueue:[], rawView:{} };

/* -------- iconos SVG monocromáticos -------- */
const ICONS = {
  flame: (active)=>`<svg viewBox="0 0 24 24" width="22" height="22" class="icon-nav" stroke-width="${active?2.4:2}"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`,
  calendar: (active)=>`<svg viewBox="0 0 24 24" width="22" height="22" class="icon-nav" stroke-width="${active?2.4:2}"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  chart: (active)=>`<svg viewBox="0 0 24 24" width="22" height="22" class="icon-nav" stroke-width="${active?2.4:2}"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>`,
  edit: (active)=>`<svg viewBox="0 0 24 24" width="22" height="22" class="icon-nav" stroke-width="${active?2.4:2}"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2 2 0 1 1 3 3L9 18l-4 1 1-4Z"/></svg>`,
  snowflake: ()=>`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/></svg>`,
  chevronL: ()=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>`,
  chevronR: ()=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg>`,
};

function pad2(n){ return String(n).padStart(2,'0'); }
function fmtKey(d){ return String(d.getFullYear()).slice(-2)+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function keyToDate(k){ const [yy,mm,dd]=k.split('-').map(Number); return new Date(2000+yy, mm-1, dd); }
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),3200); }
function colorFor(title){
  if(HABIT_COLORS[title]) return HABIT_COLORS[title];
  const habit = STATE.data && STATE.data.habits && STATE.data.habits.find(h=>h.title===title);
  const palette = STATE.data && STATE.data.colorPalette;
  const fromCalendar = habit && habit.colorId && palette && palette[habit.colorId] && palette[habit.colorId].background;
  HABIT_COLORS[title] = fromCalendar || PALETTE[Object.keys(HABIT_COLORS).length % PALETTE.length];
  return HABIT_COLORS[title];
}

/* ============================================================
   HÁBITOS NO-DIARIOS — activeWeekdays viene del backend, leído
   directo del RRULE real del evento en Calendar (ver
   activeWeekdaysFromMaster_ en Habitracker.gs). null = diario,
   sin restricción. Esto es lo que faltaba: antes no había ningún
   chequeo acá, así que tocar un hábito MWF un martes disparaba el
   error crudo del backend ("No encontré ocurrencia de hoy").
   ============================================================ */
function isDueToday(habit){
  if(!habit || !habit.activeWeekdays) return true;
  return habit.activeWeekdays.includes(new Date().getDay());
}
function nextDueLabel(habit){
  if(!habit || !habit.activeWeekdays || !habit.activeWeekdays.length) return '';
  const dow=new Date().getDay();
  const sorted=[...habit.activeWeekdays].sort((a,b)=>a-b);
  const next = sorted.find(d=>d>dow);
  return DAY_FULL[next!==undefined ? next : sorted[0]];
}

/* ============================================================
   COMANDOS EN UBICACIÓN — parser de ⏱ (timer de sesión), ⏳ (gracia
   extra, opcional) y checklist (rutinas compuestas). Todo opcional:
     ⏱30          -> sesión de 30min, ancla = inicio real del evento de HOY
     ⏳15          -> gracia extra: 15min ADICIONALES tras el fin de la
                      sesión antes de bloquear "Perfecto" (default: 0)
     - Paso 1      -> ítem de checklist (formato principal)
     ¹Paso 1       -> también válido -- por si ya tenías pasos escritos
                      con superíndice literal en Calendar. El dígito en
                      sí se IGNORA (no hace falta mantenerlo incrementado
                      a mano); el número que se ve en la app sale siempre
                      del orden real de aparición de la línea.
   ============================================================ */
function parseLocationCommands(locationText){
  const lines = (locationText||'').split('\n').map(l=>l.trim()).filter(Boolean);
  let timerMinutes = null;
  let graceMinutes = 0;
  const checklist = [];
  lines.forEach(line=>{
    const timerMatch = line.match(/^⏱\s*(\d+)/);
    if(timerMatch){ timerMinutes = parseInt(timerMatch[1],10); return; }
    const graceMatch = line.match(/^⏳\s*(\d+)/);
    if(graceMatch){ graceMinutes = parseInt(graceMatch[1],10); return; }
    const dashMatch = line.match(/^-\s*(.+)/);
    if(dashMatch){ checklist.push(dashMatch[1].trim()); return; }
    const superMatch = line.match(/^[⁰¹²³⁴⁵⁶⁷⁸⁹]+\.?\s*(.+)/);
    if(superMatch){ checklist.push(superMatch[1].trim()); }
  });
  return { timerMinutes, graceMinutes, checklist };
}

// Estado del timer de sesión de un hábito -- el ancla (todayStartTime) viene
// del backend, tomada directo de la ocurrencia real de HOY en Calendar, así
// que no se puede evadir escribiendo cualquier cosa en el cliente. La gracia
// (⏳) se suma DESPUÉS del fin de la sesión, no la reemplaza. OJO: el
// bloqueo en sí (deshabilitar "Perfecto") es solo client-side por decisión
// explícita -- alguien pegándole directo al endpoint puede seguir mandando
// ✅ tarde. Ver nota en el resumen de la conversación.
function getHabitTimerState(habit){
  const { timerMinutes: configuredMinutes, graceMinutes } = parseLocationCommands(habit.location);
  if(!habit.todayStartTime) return { hasTimer:false, locked:false };
  const start = new Date(habit.todayStartTime).getTime();

  // Sin ⏱N explícito: la duración natural es el propio bloque que el
  // evento ya tiene en Calendar (fin real de hoy - inicio real de hoy).
  // Todo hábito con hora fija tiene esto, así que la puntualidad se
  // evalúa siempre -- ⏱N en Ubicación es un override opcional para
  // cuando la ventana "cuenta" debe ser distinta a la del bloque.
  let durationMinutes = configuredMinutes;
  if(!durationMinutes && habit.todayEndTime){
    durationMinutes = Math.round((new Date(habit.todayEndTime).getTime() - start) / 60000);
  }
  if(!durationMinutes || durationMinutes <= 0) return { hasTimer:false, locked:false };

  const sessionEnd = start + durationMinutes*60000;
  const deadline = sessionEnd + (graceMinutes||0)*60000;
  const now = Date.now();
  const inGrace = now > sessionEnd && now <= deadline;
  return {
    hasTimer:true, deadline, sessionEnd, graceMinutes: graceMinutes||0,
    start, durationMinutes, isDefaultDuration: !configuredMinutes,
    locked: now > deadline, inGrace,
    minutesLeft: Math.max(0, Math.ceil((deadline-now)/60000))
  };
}

function fmtHM(ms){
  const d=new Date(ms);
  return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}
// "7:35 - 9:35" -- el segundo número YA incluye la gracia (⏳), porque
// es hasta ahí que el hábito sigue siendo logueable como puntual/perfecto.
// Hábitos sin hora fija (todo el día) devuelven '' -- no hay rango que mostrar.
function habitTimeRangeLabel(habit){
  const timer=getHabitTimerState(habit);
  if(!timer.hasTimer) return '';
  return `${fmtHM(timer.start)} - ${fmtHM(timer.deadline)}`;
}

/* ============================================================
   AUTO-CLASIFICACIÓN — el usuario deja de elegir Perfecto vs Ok a
   mano; solo confirma "lo hice" y el sistema decide, evaluando
   condiciones objetivas (puntualidad + checklist). Aplica a todo
   hábito con hora real en Calendar (puntualidad siempre evaluable,
   con o sin ⏱ explícito) y/o checklist configurado. Solo un hábito
   de "todo el día" sin checklist se queda sin nada objetivo contra
   qué medir, y sigue con el gesto manual de 2 zonas de siempre.
   ============================================================ */
function hasAutoGrading(habit){
  const timer = getHabitTimerState(habit);
  const { checklist } = parseLocationCommands(habit.location);
  return timer.hasTimer || checklist.length > 0;
}
function autoClassifyOutcome(habit){
  const timer = getHabitTimerState(habit);
  const { checklist } = parseLocationCommands(habit.location);
  const todayKey = STATE.data.today.key;
  const checklistOk = !checklist.length || checklistComplete(habit.title, todayKey, checklist);
  const timerOk = !timer.hasTimer || !timer.locked;
  return (checklistOk && timerOk) ? '✅' : '🟩';
}

/* ============================================================
   CHECKLIST — estado por hábito+día en localStorage (se resetea
   solo al cambiar la fecha, porque la key incluye el día de hoy).
   ============================================================ */
const SUPERSCRIPT_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function toSuperscript(n){
  return String(n).split('').map(d=>SUPERSCRIPT_DIGITS[d]||d).join('');
}

function checklistKey_(title, dateKey){ return 'habitChecklist_'+title+'__'+dateKey; }
function getChecklistState(title, dateKey, steps){
  try{
    const saved = JSON.parse(localStorage.getItem(checklistKey_(title,dateKey))||'[]');
    return steps.map((s,i)=>!!saved[i]);
  }catch(e){ return steps.map(()=>false); }
}
function toggleChecklistItem(title, dateKey, idx){
  const habit = STATE.data.habits.find(h=>h.title===title);
  if(!habit) return;
  const { checklist } = parseLocationCommands(habit.location);
  const state = getChecklistState(title,dateKey,checklist);
  state[idx] = !state[idx];
  try{ localStorage.setItem(checklistKey_(title,dateKey), JSON.stringify(state)); }catch(e){}
  renderTab();
}
function checklistComplete(title, dateKey, steps){
  if(!steps.length) return true;
  return getChecklistState(title,dateKey,steps).every(Boolean);
}

/* ============================================================
   HAPTICS — navigator.vibrate no existe en Safari/iOS (ni en
   navegador ni instalada como PWA). Se llama siempre detrás de un
   feature-check ('vibrate' in navigator), así que en esos casos
   la llamada simplemente no hace nada -- no rompe ni afecta ningún
   otro comportamiento de la app, es un no-op puro y aislado.
   ============================================================ */
function hapticPulse(pattern){
  if('vibrate' in navigator){
    try{ navigator.vibrate(pattern); }catch(e){ /* no-op */ }
  }
}

/* ============================================================
   EXPORT JSON — pensado para pegarle a una IA sin releer meses
   de texto crudo. Todo sale de datos que ya están en memoria,
   no pega al servidor.
   ============================================================ */
function buildExportPayload(){
  const data=getEffectiveData();
  const byDate=getByDateMap(data.allLogs);
  const streak=computeStreakClient(data.allLogs, data.streakState.mode, data.streakState);
  return {
    generadoEn: new Date().toISOString(),
    calendario: data.calendarName,
    racha_actual: streak,
    modo: data.streakState.mode,
    freezes_disponibles: data.streakState.freezesAvailable,
    reparacion_hardcore: data.streakState.repair || null,
    habitos: data.habits.map(h=>({
      titulo: h.title,
      capital: h.capital,
      ultimo_estado: h.lastLog ? { fecha:h.lastLog.key, estado:h.lastLog.estado, motivo:h.lastLog.motivo } : null,
      historial_reciente: h.logs.slice(-30).map(l=>({fecha:l.key, estado:l.estado, motivo:l.motivo})),

    })),
    total_dias_con_registro: Object.keys(byDate).length
  };
}

/* ============================================================
   CLIENTE DE RED
   ============================================================
   callServer(action, params) funciona en dos modos:
   - Dentro de Apps Script (HtmlService): usa el bridge nativo
     google.script.run — no hay CORS porque es mismo origen.
   - Servido desde otro dominio (GitHub Pages, etc.): usa JSONP
     contra WEBAPP_URL, que rodea CORS por completo (Apps Script
     Web Apps no soportan el preflight OPTIONS de fetch normal).
*/
let _jsonpCounter = 0;
function jsonpCall(action, params){
  return new Promise((resolve, reject)=>{
    if(!WEBAPP_URL || WEBAPP_URL.indexOf('PEGA_AQUI') !== -1){
      reject(new Error('DEMO')); return;
    }
    const cbName = '_jsonpCb_' + (_jsonpCounter++) + '_' + Date.now();
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('Timeout esperando al servidor')); }, 15000);
    function cleanup(){ clearTimeout(timeout); delete window[cbName]; const s=document.getElementById(cbName); if(s) s.remove(); }
    window[cbName] = (resp)=>{
      cleanup();
      if(resp && resp.ok) resolve(resp.data);
      else reject(new Error((resp && resp.error) || 'Error desconocido del servidor'));
    };
    const qs = new URLSearchParams({ action, callback: cbName, ...params }).toString();
    const script = document.createElement('script');
    script.id = cbName;
    script.src = WEBAPP_URL + '?' + qs;
    script.onerror = ()=>{ cleanup(); reject(new Error('No se pudo contactar el servidor')); };
    document.body.appendChild(script);
  });
}

function callServer(action, params){
  params = params || {};
  if(typeof google!=='undefined' && google.script && google.script.run){
    const fnMap = { initialData:'getInitialData', addLog:'addLogLine', setMode:'setMode', rawWindow:'getRawWindow', mergeWindow:'mergeRecentLogLines', resetSeries:'resetHabitSeries' };
    const argsMap = {
      initialData: [], addLog:[params.title, params.estado, params.motivo],
      setMode:[params.mode], rawWindow:[params.title, params.days],
      mergeWindow:[params.title, params.text, params.days], resetSeries:[params.title]
    };
    return new Promise((resolve, reject)=>{
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[fnMap[action]](...argsMap[action]);
    });
  }
  return jsonpCall(action, params);
}

/* ============================================================
   OFFLINE: cola de pendientes + caché de datos + auto-sync
   ============================================================ */
const QUEUE_KEY = 'habitTrackerPendingQueue_v1';
const DATA_CACHE_KEY = 'habitTrackerDataCache_v1';

function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } }
function saveQueueToStorage(q){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){} }
function cacheData(data){ try{ localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(data)); }catch(e){} }
function loadCachedData(){ try{ return JSON.parse(localStorage.getItem(DATA_CACHE_KEY)||'null'); }catch(e){ return null; } }

function buildLogLine(estado, motivoRaw){
  const now=new Date();
  const dayEmoji=DAY[now.getDay()];
  const key=fmtKey(now);
  let motivo=(motivoRaw||'').trim().replace(/\s+/g,'').replace(/^#/,'').substring(0,30)||'Hecho';
  motivo=motivo.charAt(0).toUpperCase()+motivo.slice(1);
  const raw=`${dayEmoji}${key}${estado}#${motivo}`;
  const score= estado==='✅'?1: estado==='🟩'?0.5:-1;
  return {key, estado, motivo, raw, score, dayEmoji};
}

function enqueueLog(title, estado, motivoRaw){
  const line=buildLogLine(estado, motivoRaw);
  const item={ id:'q_'+Date.now()+'_'+Math.random().toString(36).slice(2,8), title, pending:true, retries:0, failed:false, ...line };
  STATE.pendingQueue.push(item);
  saveQueueToStorage(STATE.pendingQueue);
  return item;
}

// Reintenta a mano un registro que ya se marcó como fallido permanente
// (superó MAX_SYNC_RETRIES) -- resetea su contador y lo vuelve a poner
// en juego para el ciclo normal de sincronización.
function retryPendingItem(id){
  const item=(STATE.pendingQueue||[]).find(i=>i.id===id);
  if(!item) return;
  item.failed=false; item.retries=0; delete item.lastError;
  saveQueueToStorage(STATE.pendingQueue);
  renderTab();
  trySync(true);
}

function cancelPending(id){
  STATE.pendingQueue=(STATE.pendingQueue||[]).filter(i=>i.id!==id);
  saveQueueToStorage(STATE.pendingQueue);
  renderTab();
  showToast('Registro pendiente eliminado');
}

function getEffectiveData(){
  const data=STATE.data;
  if(!data) return data;
  if(!STATE.pendingQueue || !STATE.pendingQueue.length) return data;
  const habitsMap={};
  data.habits.forEach(h=>{ habitsMap[h.title]={ ...h, logs:[...h.logs] }; });
  STATE.pendingQueue.forEach(item=>{
    if(!habitsMap[item.title]) habitsMap[item.title]={ title:item.title, logs:[], capital:0, lastLog:null, seriesCount:1 };
    habitsMap[item.title].logs.push(item);
  });
  const habits=Object.values(habitsMap).map(h=>{
    const sorted=[...h.logs].sort((a,b)=>a.key.localeCompare(b.key));
    return { ...h, logs:sorted, lastLog:sorted[sorted.length-1]||null, capital:sorted.reduce((s,l)=>s+Math.max(0,l.score),0) };
  });
  const allLogs=[...data.allLogs, ...STATE.pendingQueue];
  return { ...data, habits, allLogs };
}

// Tope de reintentos automáticos por registro. Sin esto, un registro que
// falla por una razón NO transitoria (ej. el hábito ya no tiene ocurrencia
// hoy, o cualquier error 4xx del backend) reintentaba cada 30s para
// siempre, y como siempre se probaba el head de la cola, también trababa
// a todos los registros que venían detrás. Al superar el tope, el item se
// marca `failed` (no se borra, para no perder el registro) y se salta al
// siguiente pendiente -- el usuario lo ve en Log con un botón "reintentar".
const MAX_SYNC_RETRIES = 5;

let syncInFlight=false;
function trySync(showFeedback){
  if(syncInFlight) return;
  if(!STATE.pendingQueue || !STATE.pendingQueue.length) return;
  if(navigator.onLine===false) return;
  const item = STATE.pendingQueue.find(i=>!i.failed);
  if(!item) return; // todo lo pendiente ya falló permanentemente, espera acción manual
  syncInFlight=true;
  callServer('addLog', {title:item.title, estado:item.estado, motivo:item.motivo}).then(r=>{
    syncInFlight=false;
    STATE.pendingQueue = STATE.pendingQueue.filter(i=>i.id!==item.id);
    saveQueueToStorage(STATE.pendingQueue);
    if(STATE.data) STATE.data.streakState = r.streakState || STATE.data.streakState;
    // aviso conocido: el servidor fecha el log con SU día actual, no
    // con el día en que lo hiciste offline — si difieren, avisamos.
    if(r.dateUsed && r.dateUsed !== item.key){
      showToast(`⚠️ "${item.title}" se guardó con fecha ${r.dateUsed} (lo hiciste el ${item.key}) — corrígelo en Log > historial editable`);
    }
    if(STATE.pendingQueue.some(i=>!i.failed)){
      trySync(showFeedback);
    } else {
      if(showFeedback && !STATE.pendingQueue.length && !(r.dateUsed && r.dateUsed !== item.key)) showToast('☁️ Todo sincronizado');
      load();
    }
    renderTab();
  }).catch(e=>{
    syncInFlight=false;
    item.retries = (item.retries||0) + 1;
    item.lastError = (e && e.message) || 'Error desconocido';
    if(item.retries >= MAX_SYNC_RETRIES){
      item.failed = true;
      showToast(`⚠️ "${item.title}" no se pudo sincronizar tras ${MAX_SYNC_RETRIES} intentos — revisalo en Log`);
    } else if(showFeedback){
      showToast('⚠️ Sin conexión con el servidor, reintento luego');
    }
    saveQueueToStorage(STATE.pendingQueue);
    renderTab();
    // si este se marcó failed pero quedan otros sin marcar, seguimos con
    // el próximo en vez de quedar trabados en el mismo para siempre
    if(item.failed && STATE.pendingQueue.some(i=>!i.failed)){
      trySync(showFeedback);
    }
  });
}

function getByDateMap(allLogs){
  const m={}; allLogs.forEach(l=>{ if(!m[l.key]) m[l.key]=[]; m[l.key].push(l); }); return m;
}

function computeStreakClient(allLogs, mode, streakState){
  const byDate=getByDateMap(allLogs);
  const today=new Date();
  let streak=0, freezesLeft=streakState.freezesAvailable||0;
  let cursor=new Date(today);
  const todayKey=fmtKey(today);
  if(!byDate[todayKey] || byDate[todayKey].length===0) cursor.setDate(cursor.getDate()-1);
  for(let i=0;i<400;i++){
    const key=fmtKey(cursor);
    const logs=byDate[key]||[];
    const hasFail=logs.some(l=>l.estado==='❎');
    const dayEmpty=logs.length===0;
    const dayFailed=hasFail||dayEmpty;
    if(!dayFailed){ streak++; }
    else if(mode==='resiliente' && freezesLeft>0){ freezesLeft--; streak++; }
    else break;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

// Countdown de "modo hardcore" -- por decisión explícita, solo se muestra
// en la ventana real de peligro (últimas 24h de las 72h de reparación),
// no durante toda la ventana. Actualiza el span directo (sin re-render
// completo) para no interrumpir lo que se esté tocando en pantalla.
let _hardcoreCountdownInterval = null;
function updateHardcoreCountdown(){
  const el = document.getElementById('hardcoreCountdown');
  if(!el){ clearInterval(_hardcoreCountdownInterval); _hardcoreCountdownInterval=null; return; }
  const repair = STATE.data && STATE.data.streakState && STATE.data.streakState.repair;
  if(!repair){ el.textContent=''; return; }
  const msLeft = new Date(repair.deadlineISO).getTime() - Date.now();
  if(msLeft <= 0){ el.textContent=' • ⏰ ventana de reparación vencida'; return; }
  if(msLeft > 24*60*60*1000){ el.textContent=''; return; } // fuera de la ventana de peligro todavía
  const h=Math.floor(msLeft/3600000), m=Math.floor((msLeft%3600000)/60000), s=Math.floor((msLeft%60000)/1000);
  el.textContent = ` • 🔥 ÚLTIMO DÍA ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// Aviso PREVENTIVO diario -- distinto del countdown de arriba. Ese es de
// RESCATE (aparece después de fallar, corre 72h). Este es preventivo:
// avisa ANTES de fallar, todos los días, en el último tramo antes de
// medianoche, si Hardcore está activo y hoy todavía no hay ni un solo
// log (con un solo log de cualquier hábito, el día ya no cuenta como
// vacío para la racha -- ver computeStreak/computeStreakClient).
const DAILY_DANGER_HOURS_BEFORE_MIDNIGHT = 3;
function computeDailyDangerState_(){
  const data = STATE.data;
  if(!data || data.streakState.mode !== 'hardcore') return null;
  if(data.streakState.repair) return null; // si ya está reparando, esa alerta manda y no se solapan
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0,0,0,0);
  const msLeft = midnight - now;
  if(msLeft > DAILY_DANGER_HOURS_BEFORE_MIDNIGHT*3600000) return null;
  const todayKey = data.today.key;
  const logsHoy = (getEffectiveData().allLogs||[]).filter(l=>l.key===todayKey);
  if(logsHoy.length > 0) return null; // ya hay algo logueado hoy -- el día ya no cuenta como vacío
  return { msLeft };
}
function updateDailyDangerBanner(){
  const banner = document.getElementById('dailyDangerBanner');
  const countdownEl = document.getElementById('dailyDangerCountdown');
  if(!banner || !countdownEl) return;
  const state = computeDailyDangerState_();
  if(!state){ banner.classList.add('hidden'); return; }
  banner.classList.remove('hidden');
  const h=Math.floor(state.msLeft/3600000), m=Math.floor((state.msLeft%3600000)/60000), s=Math.floor((state.msLeft%60000)/1000);
  countdownEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* ================= PESTAÑA 2: Calendario navegable + heatmap ================= */
function renderCalendarTab(el){
  const data=getEffectiveData(); const byDate=getByDateMap(data.allLogs);
  const streakState=data.streakState;

  const base=new Date(); base.setMonth(base.getMonth()+STATE.calMonthOffset); base.setDate(1);
  const year=base.getFullYear(), month=base.getMonth();
  const firstDow=(new Date(year,month,1).getDay());
  const daysInMonth=new Date(year,month+1,0).getDate();
  const monthLabel=base.toLocaleDateString('es-ES',{month:'long',year:'numeric'});

  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++){
    const dt=new Date(year,month,d);
    const k=fmtKey(dt);
    const logs=byDate[k]||[];
    let status='empty';
    if(dt> new Date()) status='future';
    else if(logs.some(l=>l.estado==='❎')) status = streakState.freezeUsedDates?.includes(k) ? 'frozen' : 'fail';
    else if(logs.length && logs.every(l=>l.estado==='✅')) status='perfect';
    else if(logs.length) status='ok';
    cells.push({d, k, status});
  }

  const perfectCount=cells.filter(c=>c && c.status==='perfect').length;
  const pastCount=cells.filter(c=>c && (c.status!=='future')).length;

  let maxStreak=0, curS=0;
  const sortedDays=[...new Set(data.allLogs.map(l=>l.key))].sort();
  sortedDays.forEach(k=>{
    const logs=byDate[k];
    if(logs.some(l=>l.estado==='❎')) curS=0; else { curS++; maxStreak=Math.max(maxStreak,curS); }
  });

  el.innerHTML = `

        </div>
        <div class="mono text-[11px] text-[#7d8590]">Congeladas usadas: ${(streakState.freezeUsedDates||[]).length} • Días perfectos este mes: ${perfectCount}/${pastCount||daysInMonth}</div>

          <div class="mono text-[13px] font-bold capitalize">${monthLabel}</div>
          <button onclick="STATE.calMonthOffset=Math.min(0,STATE.calMonthOffset+1); render()" class="w-8 h-8 rounded-full bg-[#161b22] border border-[#21262d] flex items-center justify-center ${STATE.calMonthOffset>=0?'opacity-30 pointer-events-none':''}">${ICONS.chevronR()}</button>
        </div>
        <div class="grid grid-cols-7 gap-1 mb-2">${DAY_FULL.map(d=>`<div class="text-center mono text-[9px] font-bold text-[#7d8590] py-1">${d[0]}</div>`).join('')}</div>
        <div class="grid grid-cols-7 gap-1.5">
          ${cells.map(c=>{
            if(!c) return `<div class="aspect-square"></div>`;
            let bg='#0d1117', bd='#21262d', txt='#484f58', extra='';
            if(c.status==='perfect'){ bg='#58CC02'; bd='#fff'; txt='#000'; extra='font-bold'; }
            else if(c.status==='ok'){ bg='#1a3a14'; bd='#58CC02'; txt='#58CC02'; }
            else if(c.status==='frozen'){ bg='#0d3a4a'; bd='#38bdf8'; txt='#38bdf8'; }
            else if(c.status==='fail'){ bg='#21262d'; bd='#ff4b4b55'; txt='#ff7b72'; }
            else if(c.status==='future'){ txt='#2a3138'; }
            return `<div class="aspect-square rounded-[10px] border-2 flex items-center justify-center mono text-[11px] ${extra}" style="background:${bg};border-color:${bd};color:${txt}">
              ${c.status==='frozen' ? ICONS.snowflake() : c.d}
            </div>`;
          }).join('')}
        </div>
        <div class="flex flex-wrap gap-3 mt-4 mono text-[9px] text-[#7d8590]">
          <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 rounded-sm" style="background:#58CC02"></div>perfecto</span>
          <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 rounded-sm" style="background:#1a3a14;border:1px solid #58CC02"></div>cumplido</span>
          <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 rounded-sm" style="background:#0d3a4a;border:1px solid #38bdf8"></div>freeze usado</span>
          <span class="flex items-center gap-1"><div class="w-2.5 h-2.5 rounded-sm" style="background:#21262d;border:1px solid #ff4b4b55"></div>fallo</span>
        </div>
      </div>

      <div class="rounded-[20px] bg-[#0d1117] border border-[#21262d] p-5">
        <h3 class="font-bold mono text-[11px] tracking-widest text-[#7d8590] mb-3">DENSIDAD SEMESTRAL • SIN ROJO • GRIS→VERDE</h3>
        <div class="flex gap-[3px]">
          <div class="grid grid-rows-7 gap-[3px] mono text-[8px] text-[#5d666f] pr-1">
            ${['D','L','M','X','J','V','S'].map(d=>`<div class="h-[12px] flex items-center">${d}</div>`).join('')}
          </div>
          <div class="grid grid-flow-col grid-rows-7 gap-[3px] overflow-x-auto scrollbar-thin pb-2">
            ${(()=>{
              const weeks = 26;
              const todayDow = new Date().getDay(); // 0=Dom .. 6=Sáb
              const gridStart = new Date(); gridStart.setHours(0,0,0,0);
              gridStart.setDate(gridStart.getDate() - todayDow - (weeks-1)*7); // domingo de la semana más vieja mostrada
              const hoy = new Date(); hoy.setHours(0,0,0,0);
              let out='';
              for(let col=0; col<weeks; col++){
                for(let row=0; row<7; row++){
                  const dt = new Date(gridStart); dt.setDate(dt.getDate() + col*7 + row);
                  if(dt > hoy){ out += `<div class="w-[12px] h-[12px] rounded-[3px]"></div>`; continue; }
                  const k = fmtKey(dt);
                  const logsDelDia = byDate[k]||[];
                  const avg = logsDelDia.length ? logsDelDia.reduce((s,l)=>s+l.score,0)/logsDelDia.length : null;
                  let bg="#161b22"; // sin ningún registro ese día

function drawChart(){
  const canvas=document.getElementById('chart'); if(!canvas) return;
  const ctx=canvas.getContext('2d'); const data=getEffectiveData(); const byDate=getByDateMap(data.allLogs);
  const cssW=canvas.offsetWidth, cssH=220;
  canvas.width=cssW*2; canvas.height=cssH*2; ctx.setTransform(2,0,0,2,0,0);
  const pad={l:28,r:10,t:16,b:22}; const cw=cssW-pad.l-pad.r; const ch=cssH-pad.t-pad.b;

  const days=[]; for(let i=59;i>=0;i--){ let dt=new Date(); dt.setDate(dt.getDate()-i); days.push({dt, k:fmtKey(dt)}); }
  const perHabit={}; data.habits.forEach(h=>{ perHabit[h.title]=[]; let cum=0; days.forEach(d=>{ const mine=h.logs.filter(l=>l.key===d.k); const score=mine.reduce((s,l)=>s+l.score,0); cum=Math.max(0,cum+score); perHabit[h.title].push(cum); }); });
  // Línea blanca = PROMEDIO entre hábitos, no suma -- así no crece
  // artificialmente solo por tener más hábitos cargados; refleja qué tan
  // bien te va en promedio, comparable día a día sin importar cuántos
  // hábitos sigas.
  const habitCount = Math.max(1, data.habits.length);
  const promedio=days.map((_,i)=> Object.values(perHabit).reduce((s,arr)=>s+arr[i],0) / habitCount);
  const maxVal=Math.max(1,...promedio, ...Object.values(perHabit).flat());

  ctx.clearRect(0,0,cssW,cssH);
  ctx.strokeStyle='#21262d'; ctx.setLineDash([4,4]);
  for(let i=0;i<=4;i++){ const y=pad.t + ch - (i/4)*ch; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle='#5d666f'; ctx.font='9px monospace'; ctx.fillText(Math.round(maxVal*i/4), 2, y+3); ctx.setLineDash([4,4]); }
  ctx.setLineDash([]);

  const pointsTotal = promedio.map((v,i)=>({x: pad.l + (i/(days.length-1))*cw, y: pad.t + ch - (v/maxVal)*ch, v, k:days[i].k}));

  if(STATE.chartMode!=='total'){
    Object.entries(perHabit).forEach(([title,arr])=>{
      ctx.strokeStyle=colorFor(title); ctx.lineWidth=2; ctx.beginPath();
      arr.forEach((v,i)=>{ const x=pad.l + (i/(days.length-1))*cw; const y=pad.t + ch - (v/maxVal)*ch; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
      ctx.stroke();
    });
  }
  ctx.strokeStyle='white'; ctx.lineWidth=3; ctx.beginPath();
  pointsTotal.forEach((p,i)=>{ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }); ctx.stroke();

  function handleTouch(clientX){
    const rect=canvas.getBoundingClientRect(); const x=clientX-rect.left;
    let closest=pointsTotal[0], minDist=Infinity;
    pointsTotal.forEach(p=>{ const d=Math.abs(p.x-x); if(d<minDist){ minDist=d; closest=p; } });
    const tip=document.getElementById('chartTip'); if(!tip) return;
    const logsThatDay=byDate[closest.k]||[];
    const detail = logsThatDay.length ? logsThatDay.map(l=>`${l.estado} ${l.motivo||''}`).join(' · ') : 'sin registros';
    tip.innerHTML = `<strong class="text-white">${closest.k}</strong> · promedio ${closest.v.toFixed(2)} · ${detail}`;
  }
  canvas.onmousemove = (e)=>handleTouch(e.clientX);
  canvas.ontouchstart = canvas.ontouchmove = (e)=>{ handleTouch(e.touches[0].clientX); e.preventDefault(); };
}

            <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full" style="background:${colorFor(h.title)}"></div><div class="font-semibold">${h.title} • capital ${h.capital.toFixed(1)} • ${h.seriesCount} serie${h.seriesCount>1?'s':''}</div></div>
            <button onclick="toggleRawView('${h.title.replace(/'/g,"\\'")}')" class="mono text-[10px] text-[#7d8590] border border-[#21262d] rounded-full px-2.5 py-1 whitespace-nowrap">${STATE.rawView[h.title]?.open ? 'Ocultar' : 'Ver/editar historial'}</button>
          </div>
          <div class="mono text-[10px] text-[#5d666f] mt-1 max-h-[100px] overflow-auto space-y-0.5">
            ${h.logs.slice(-6).map(l=>{
              if(l.pending && l.failed){
                return `<div class="flex items-center justify-between gap-2 text-[#ff7b72]"><span>⚠️ ${l.raw} <span class="opacity-60">(${l.retries||0} intentos)</span></span><span class="flex gap-2 flex-shrink-0"><button onclick="retryPendingItem('${l.id}')" class="text-[#58CC02] px-1">↻ reintentar</button><button onclick="cancelPending('${l.id}')" class="text-[#7d8590] px-1">✕</button></span></div>`;
              }
              if(l.pending){
                return `<div class="flex items-center justify-between gap-2 text-[#f59e0b]"><span>⏳ ${l.raw}</span><button onclick="cancelPending('${l.id}')" class="text-[#7d8590] px-1">✕</button></div>`;
              }
              return `<div>${l.raw}</div>`;
            }).join('') || 'sin logs'}
          </div>
          <div id="rawView_${idx}"></div>
          <div class="mt-3">${renderHabitSlider(h)}${habitExtraInfo(h)}</div>
        </div>
      `).join('')}
    </div>
  `;

  Object.keys(STATE.rawView).forEach(title=>{ if(STATE.rawView[title]?.open) renderRawViewBlock(title); });
}

function rawViewElId(title){
  const data = getEffectiveData();
  const idx = data.habits.findIndex(h=>h.title===title);
  return 'rawView_'+(idx>=0 ? idx : title.replace(/[^a-zA-Z0-9]/g,'_'));
}

function toggleRawView(title){
  const cur = STATE.rawView[title] || { open:false, days:14, loading:false, data:null, editText:'' };
  cur.open = !cur.open;
  STATE.rawView[title] = cur;
  if(cur.open && !cur.data) loadRawView(title, cur.days);
  else renderRawViewBlock(title);
}

function loadRawView(title, days){
  const cur = STATE.rawView[title];
  cur.loading = true; cur.days = days;
  renderRawViewBlock(title);
  callServer('rawWindow', {title, days}).then(data=>{
    cur.loading = false;
    cur.data = data;
    cur.editText = data.windowText;
    renderRawViewBlock(title);
  }).catch(e=>{
    cur.loading = false;
    cur.error = e.message;
    renderRawViewBlock(title);
  });
}

function saveRawView(title){
  const cur = STATE.rawView[title];
  const textarea = document.getElementById(rawViewElId(title)+'_textarea');
  const text = textarea ? textarea.value : cur.editText;
  cur.saving = true;
  renderRawViewBlock(title);
  callServer('mergeWindow', {title, text, days: cur.days}).then(r=>{
    cur.saving = false;
    showToast(`💾 Guardado — ${r.savedLines} líneas en la ventana, ${r.totalLines} en total`);
    cur.data = null;
    loadRawView(title, cur.days);
    load(); // refresca todo (racha, gráficos, etc. pueden depender de esto)
  }).catch(e=>{
    cur.saving = false;
    showToast('⚠️ No se pudo guardar: ' + e.message);
    renderRawViewBlock(title);
  });
}

function renderRawViewBlock(title){
  const holder = document.getElementById(rawViewElId(title));
  if(!holder) return;
  const cur = STATE.rawView[title];
  if(!cur || !cur.open){ holder.innerHTML=''; return; }

  if(cur.loading){
    holder.innerHTML = `<div class="mono text-[10px] text-[#5d666f] mt-3">Cargando historial…</div>`;
    return;
  }
  if(cur.error){
    holder.innerHTML = `<div class="mono text-[10px] text-[#ff7b72] mt-3">⚠️ ${cur.error}</div>`;
    return;
  }
  if(!cur.data) return;

  holder.innerHTML = `
    <div class="mt-3 rounded-[12px] bg-[#161b22] border border-[#21262d] p-3">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-2">
        <div class="mono text-[9px] text-[#5d666f]">Editando desde ${cur.data.windowFrom} • ${cur.data.totalLines} líneas en total en esta serie • ${cur.data.seriesCount} serie${cur.data.seriesCount>1?'s':''} detectada${cur.data.seriesCount>1?'s':''}</div>
        <div class="flex bg-[#0d1117] rounded-full p-1 border border-[#21262d]">
          ${[7,14,30].map(d=>`<button onclick="loadRawView('${title.replace(/'/g,"\\'")}', ${d})" class="px-2 py-0.5 rounded-full text-[9px] mono ${cur.days===d?'bg-white text-black':'text-[#7d8590]'}">${d}d</button>`).join('')}
        </div>
      </div>
      <textarea id="${rawViewElId(title)}_textarea" class="w-full bg-[#0d1117] border border-[#21262d] rounded-[10px] p-2 text-[11px] text-[#e6edf3] outline-none focus:border-[#58CC02]" rows="${Math.max(4, cur.editText.split('\n').length+1)}">${cur.editText}</textarea>
      <p class="mono text-[9px] text-[#5d666f] mt-1">Una línea por día, formato ${'\u{1F145}'}26-07-30${'\u2705'}#Motivo. Borrar una línea borra ese día; una línea nueva crea/reemplaza el día correspondiente. Solo se toca esta ventana — el resto del historial no se modifica.</p>
      <div class="flex gap-2 mt-2">
        <button onclick="saveRawView('${title.replace(/'/g,"\\'")}')" class="flex-1 py-2 rounded-full bg-white text-black mono text-[11px] font-bold" ${cur.saving?'disabled':''}>${cur.saving?'Guardando…':'Guardar cambios'}</button>
        <button onclick="loadRawView('${title.replace(/'/g,"\\'")}', ${cur.days})" class="px-4 py-2 rounded-full bg-[#21262d] mono text-[11px]">Recargar</button>
      </div>
    </div>
  `;
}

/* ============================================================
   TIMER EMERGENTE (popup ⏱) — independiente del timer de sesión
   por hábito. Sonido por defecto sintetizado (siempre funciona,
   sin depender de ningún archivo externo); opcional: elegir un
   audio propio del dispositivo vía el picker nativo del sistema
   (<input type=file>, la única forma real de "abrir con..." que
   permite la web -- no hay acceso a filesystem persistente).
   ============================================================ */
let TIMER_STATE = { running:false, endsAt:0, totalMs:0, intervalId:null, customAudioUrl:null, habitTitle:null };

function playDefaultBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,1,2].forEach(i=>{
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type='sine'; osc.frequency.value=880;
      osc.connect(gain); gain.connect(ctx.destination);
      const t = ctx.currentTime + i*0.35;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.4, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
      osc.start(t); osc.stop(t+0.3);
    });
  }catch(e){ /* AudioContext no disponible -- se pierde el sonido, no rompe nada más */ }
}
function playAlertSound(){
  if(TIMER_STATE.customAudioUrl){
    const audio = new Audio(TIMER_STATE.customAudioUrl);
    audio.play().catch(()=>playDefaultBeep());
  } else {
    playDefaultBeep();
  }
  hapticPulse([120,60,120,60,200]);
}

function openTimerModal(habitTitle){
  const habit = STATE.data.habits.find(h=>h.title===habitTitle);
  TIMER_STATE.habitTitle = habitTitle || null;
  const label = document.getElementById('timerHabitLabel');
  const minutesInput = document.getElementById('timerMinutesInput');
  if(habit){
    const t = getHabitTimerState(habit);
    label.textContent = habit.title;
    // Precarga la duración vigente para este hábito (⏱ explícito, o si
    // no hay, la del propio bloque de Calendar) -- pero queda editable
    // acá mismo por si esta sesión puntual necesita correr distinto.
    minutesInput.value = t.hasTimer ? t.durationMinutes : 5;
  } else {
    label.textContent = '';
    minutesInput.value = 5;
  }
  document.getElementById('timerModal').classList.remove('hidden');
  document.getElementById('timerIdleView').classList.remove('hidden');
  document.getElementById('timerRunningView').classList.add('hidden');
  document.getElementById('timerDoneView').classList.add('hidden');
}
function closeTimerModal(){
  document.getElementById('timerModal').classList.add('hidden');
}
// Al terminar el timer, loguea directo el hábito al que estaba atado --
// respeta la misma regla de checklist que el slider (no deja ✅ si hay
// pasos sin completar) y reusa el modal de motivo obligatorio de siempre.
function logFromTimer(estado){
  const title = TIMER_STATE.habitTitle;
  if(!title){ closeTimerModal(); return; }
  if(estado === '✅'){
    const habit = STATE.data.habits.find(h=>h.title===title);
    const { checklist } = parseLocationCommands(habit ? habit.location : '');
    if(!checklistComplete(title, STATE.data.today.key, checklist)){
      showToast('⚠️ Completá el checklist antes de marcar Perfecto');
      return;
    }
  }
  closeTimerModal();
  openModal(title, estado);
}
function startEmergentTimer(){
  const minutes = Math.max(1, parseInt(document.getElementById('timerMinutesInput').value,10)||5);
  TIMER_STATE.running = true;
  TIMER_STATE.totalMs = minutes*60000;
  TIMER_STATE.endsAt = Date.now() + TIMER_STATE.totalMs;
  document.getElementById('timerIdleView').classList.add('hidden');
  document.getElementById('timerRunningView').classList.remove('hidden');
  const ring = document.getElementById('timerRing');
  if(ring){ ring.style.transition='none'; ring.setAttribute('stroke-dashoffset','0'); ring.setAttribute('stroke','#58CC02'); void ring.offsetWidth; ring.style.transition=''; }
  tickEmergentTimer();
  TIMER_STATE.intervalId = setInterval(tickEmergentTimer, 500);
}
function cancelEmergentTimer(){
  clearInterval(TIMER_STATE.intervalId);
  TIMER_STATE.running = false;
  closeTimerModal();
}
function tickEmergentTimer(){
  const msLeft = TIMER_STATE.endsAt - Date.now();
  if(msLeft <= 0){
    clearInterval(TIMER_STATE.intervalId);
    TIMER_STATE.running = false;
    const ring = document.getElementById('timerRing');
    if(ring) ring.setAttribute('stroke-dashoffset', '326.7');
    document.getElementById('timerRunningView').classList.add('hidden');
    document.getElementById('timerDoneView').classList.remove('hidden');
    playAlertSound();
    return;
  }
  const totalSec = Math.ceil(msLeft/1000);
  const mm = String(Math.floor(totalSec/60)).padStart(2,'0');
  const ss = String(totalSec%60).padStart(2,'0');
  // Anillo circular que se vacía a medida que avanza el tiempo -- offset
  // 0 = anillo lleno (recién arrancado), circunferencia completa = vacío.
  const CIRC = 2*Math.PI*52;
  const elapsedFraction = TIMER_STATE.totalMs ? Math.min(1, (TIMER_STATE.totalMs-msLeft)/TIMER_STATE.totalMs) : 0;
  const ring = document.getElementById('timerRing');
  if(ring){
    ring.setAttribute('stroke-dashoffset', String(CIRC*elapsedFraction));
    const remainingFraction = 1-elapsedFraction;
    ring.setAttribute('stroke', remainingFraction>0.5 ? '#58CC02' : remainingFraction>0.2 ? '#f59e0b' : '#ff4b4b');
  }
  const disp = document.getElementById('timerCountdownDisplay');
  if(disp) disp.textContent = `${mm}:${ss}`;
}

/* ============================================================
   "EN CURSO AHORA" — botón flotante global. A diferencia del timer
   emergente (arriba, duración arbitraria elegida a mano), esto SOLO
   mira hábitos con ⏱ configurado cuyo rango real [inicio evento,
   inicio+timer+gracia] contiene el momento actual -- ningún dato
   nuevo, reusa exactamente getHabitTimerState().
   ============================================================ */
let _runningModalTitle = null;
let _runningModalInterval = null;

function getCurrentlyRunningHabits(){
  if(!STATE.data) return [];
  return STATE.data.habits.filter(h=>{
    const t = getHabitTimerState(h);
    return t.hasTimer && !t.locked && Date.now() >= t.start;
  });
}

// Se llama en cada render() -- decide si el FAB se muestra en absoluto
// (solo si existe algún hábito con ⏱ configurado, corriendo o no, para
// que sea descubrible) y si pulsa (hay algo corriendo justo ahora).
function updateRunningFab(){
  const fab = document.getElementById('runningFab');
  if(!fab || !STATE.data) return;
  const anyTimerHabit = STATE.data.habits.some(h=>getHabitTimerState(h).hasTimer);
  fab.classList.toggle('hidden', !anyTimerHabit);
  const running = getCurrentlyRunningHabits().length > 0;
  fab.classList.toggle('animate-[glow_1.8s_infinite]', running);
  fab.style.color = running ? '#58CC02' : '';
  fab.style.borderColor = running ? '#58CC0255' : '';
}

function openRunningModal(){
  const running = getCurrentlyRunningHabits();
  document.getElementById('runningPickerView').classList.add('hidden');
  document.getElementById('runningStatusView').classList.add('hidden');
  if(running.length === 0){
    showToast('No hay ningún hábito con timer corriendo ahora mismo');
    return;
  }
  document.getElementById('runningModal').classList.remove('hidden');
  if(running.length === 1){
    showRunningStatus(running[0].title);
  } else {
    document.getElementById('runningPickerView').classList.remove('hidden');
    document.getElementById('runningPickerList').innerHTML = running.map(h=>{
      const t = getHabitTimerState(h);
      const pct = Math.round(Math.min(1, (Date.now()-t.start)/(t.deadline-t.start))*100);
      return `<button onclick="showRunningStatus('${h.title.replace(/'/g,"\\'")}')" class="w-full text-left bg-[#0d1117] border border-[#21262d] rounded-[12px] p-3">
        <div class="font-semibold text-[13px]">${h.title}</div>
        <div class="mono text-[9px] text-[#5d666f] mt-1">${pct}% de la ventana</div>
      </button>`;
    }).join('');
  }
}
function showRunningStatus(title){
  _runningModalTitle = title;
  document.getElementById('runningPickerView').classList.add('hidden');
  document.getElementById('runningStatusView').classList.remove('hidden');
  renderRunningProgress();
  clearInterval(_runningModalInterval);
  _runningModalInterval = setInterval(renderRunningProgress, 1000);
}
function renderRunningProgress(){
  const habit = STATE.data && STATE.data.habits.find(h=>h.title===_runningModalTitle);
  if(!habit){ closeRunningModal(); return; }
  const t = getHabitTimerState(habit);
  if(!t.hasTimer || t.locked){ closeRunningModal(); return; } // se venció mientras estaba abierto
  const pct = Math.max(0, Math.min(100, Math.round((Date.now()-t.start)/(t.deadline-t.start)*100)));
  document.getElementById('runningHabitLabel').textContent = habit.title;
  const bar = document.getElementById('runningProgressBar');
  bar.style.width = pct+'%';
  bar.style.background = t.inGrace ? '#f59e0b' : '#58CC02';
  document.getElementById('runningProgressLabel').textContent =
    `${pct}% de [hora del evento + gracia]` + (t.inGrace ? ' • en gracia' : '') + ` • quedan ${t.minutesLeft} min`;
}
function closeRunningModal(){
  document.getElementById('runningModal').classList.add('hidden');
  clearInterval(_runningModalInterval);
  _runningModalInterval = null;
  _runningModalTitle = null;
}
function confirmFromRunningModal(){
  const title = _runningModalTitle;
  const habit = STATE.data && STATE.data.habits.find(h=>h.title===title);
  if(!habit) return;
  const estado = autoClassifyOutcome(habit);
  closeRunningModal();
  openModal(title, estado);
}

document.addEventListener('DOMContentLoaded', ()=>{
  const picker = document.getElementById('timerSoundPicker');
  if(picker){
    picker.addEventListener('change', ()=>{
      const file = picker.files && picker.files[0];
      if(!file) return;
      TIMER_STATE.customAudioUrl = URL.createObjectURL(file);
      const label = document.getElementById('timerSoundLabel');
      if(label) label.textContent = '🔊 ' + file.name.slice(0,22);
    });
  }
});

/* ============================================================
   SLIDER HÁPTICO DE 3 NIVELES — reemplaza los 3 botones ❎/🟩/✅.
   Arranca en cero (centro). Arrastrar a la derecha pasa por 🟩 y
   llega a ✅; a la izquierda, ❎. Si el timer de sesión venció, el
   tope derecho se recorta ANTES de la zona ✅ -- el thumb no llega
   ahí ni aunque el dedo siga moviéndose (bloqueo físico, no solo
   visual). Al soltar en una zona válida: pulso háptico + animación
   de pop, y recién ahí se abre el campo de contexto (motivo ahora
   obligatorio siempre, ver modalSave).
   ============================================================ */
function renderHabitSlider(habit){
  if(!isDueToday(habit)){
    return `<div class="flex items-center gap-2 h-11 px-3 rounded-[14px] bg-[#0d1117] border border-[#21262d] opacity-60">
      <span class="mono text-[11px] text-[#5d666f]">📅 No toca hoy — próximo: ${nextDueLabel(habit)}</span>
    </div>`;
  }
  const timer = getHabitTimerState(habit);
  const { checklist } = parseLocationCommands(habit.location);
  const todayKey = STATE.data.today.key;
  const checklistOk = checklistComplete(habit.title, todayKey, checklist);
  const titleAttr = habit.title.replace(/"/g,'&quot;');
  const titleJs = habit.title.replace(/'/g,"\\'");
  const auto = hasAutoGrading(habit);

  if(auto){
    // Slider de una sola zona: el usuario solo confirma "lo hice", el
    // sistema ya decide si eso vale ✅ o 🟩 (autoClassifyOutcome). La
    // distancia arrastrada más allá del umbral no cambia QUÉ se guarda,
    // solo la intensidad del haptic/animación al soltar -- puramente
    // cosmético, "más lejos, más énfasis en el premio".
    const preview = autoClassifyOutcome(habit);
    return `
      <div class="flex items-center gap-2">
        <button onclick="openModal('${titleJs}','❎')" class="flex-shrink-0 w-11 h-11 rounded-[14px] bg-[#2a1515] border border-[#ff4b4b]/50 flex items-center justify-center text-[17px] active:scale-95 transition">❎</button>
        <div class="hslider-track flex-1" data-mode="auto" data-title="${titleAttr}" data-preview="${preview}">
          <span class="hslider-label" style="right:14px;opacity:.5">confirmar</span>
          <div class="hslider-thumb" style="left:6px;opacity:0">○</div>
        </div>
        ${timer.hasTimer ? `<button onclick="openTimerModal('${titleJs}')" class="flex-shrink-0 w-11 h-11 rounded-[14px] bg-[#0d1117] border border-[#21262d] flex items-center justify-center text-[16px] active:scale-95 transition">⏱</button>` : ''}
      </div>`;
  }

  return `
    <div class="flex items-center gap-2">
      <button onclick="openModal('${titleJs}','❎')" class="flex-shrink-0 w-11 h-11 rounded-[14px] bg-[#2a1515] border border-[#ff4b4b]/50 flex items-center justify-center text-[17px] active:scale-95 transition">❎</button>
      <div class="hslider-track flex-1" data-mode="manual" data-title="${titleAttr}" data-locked="${timer.locked?1:0}" data-checklist-ok="${checklistOk?1:0}">
        <div class="hslider-zone" style="right:0;width:45%;background:linear-gradient(270deg,${timer.locked?'#58CC0210':'#58CC0233'},transparent)"></div>
        <span class="hslider-label" style="right:${timer.locked?'40px':'12px'}">${timer.locked?'🟩':'✅'}</span>
        ${!timer.locked ? `<span class="hslider-label" style="right:50px;opacity:.35;font-size:9px">🟩</span>` : ''}
        <div class="hslider-thumb" style="left:6px;opacity:0">🟩</div>
      </div>
      ${timer.hasTimer ? `<button onclick="openTimerModal('${titleJs}')" class="flex-shrink-0 w-11 h-11 rounded-[14px] bg-[#0d1117] border border-[#21262d] flex items-center justify-center text-[16px] active:scale-95 transition">⏱</button>` : ''}
    </div>`;
}

function habitExtraInfo(habit){
  const timer = getHabitTimerState(habit);
  const { checklist } = parseLocationCommands(habit.location);
  const todayKey = STATE.data.today.key;
  const parts = [];
  if(checklist.length){
    const done = getChecklistState(habit.title, todayKey, checklist).filter(Boolean).length;
    parts.push(`<div class="mt-2 space-y-1">${checklist.map((step,i)=>{
      const st = getChecklistState(habit.title, todayKey, checklist);
      return `<button onclick="toggleChecklistItem('${habit.title.replace(/'/g,"\\'")}','${todayKey}',${i})" class="w-full text-left flex items-center gap-2 mono text-[11px] px-2 py-1.5 rounded-[8px] ${st[i]?'bg-[#0d2a1a] text-[#58CC02]':'bg-[#0d1117] text-[#7d8590]'}">
        <span>${st[i]?'☑':'☐'}</span><span class="opacity-60">${toSuperscript(i+1)}</span><span class="${st[i]?'line-through opacity-70':''}">${step}</span>
      </button>`;
    }).join('')}</div><div class="mono text-[9px] text-[#5d666f] mt-1">${done}/${checklist.length} pasos • sin completarlos todos no hay ✅ Perfecto</div>`);
  }
  if(timer.hasTimer){
    const origen = timer.isDefaultDuration ? ` (duración del evento, ${timer.durationMinutes}min)` : '';
    if(timer.locked){
      parts.push(`<div class="mono text-[9px] mt-1 text-[#ff7b72]">⏱ tiempo vencido${origen}${timer.graceMinutes?' (con gracia de '+timer.graceMinutes+'min incluida)':''} — Perfecto bloqueado hoy</div>`);
    } else if(timer.inGrace){
      parts.push(`<div class="mono text-[9px] mt-1 text-[#f59e0b]">⏳ en gracia${origen} — quedan ${timer.minutesLeft} min para el bloqueo</div>`);
    } else {
      parts.push(`<div class="mono text-[9px] mt-1 text-[#58CC02]">⏱ quedan ${timer.minutesLeft} min para Perfecto${origen}${timer.graceMinutes?' (+ '+timer.graceMinutes+'min de gracia)':''}</div>`);
    }
  }
  return parts.join('');
}

let _sliderDrag = null;
function attachSliderHandlers(){
  document.querySelectorAll('.hslider-track[data-mode="manual"]').forEach(track=>{
    if(track.dataset.bound) return;
    track.dataset.bound = '1';
    const thumb = track.querySelector('.hslider-thumb');

    // ❎ ya es un botón fijo aparte (ver renderHabitSlider) -- este track
    // ahora solo decide entre 🟩 y ✅. Reposo = extremo izquierdo (neutral,
    // sin acción); hay que arrastrar activamente para elegir.
    function geometry(){
      const w = track.offsetWidth, tw = 40;
      const maxOffset = w - tw - 12;
      return { maxOffset, restAt: 0, okAt: 0.42*maxOffset, perfectAt: 0.82*maxOffset };
    }
    function setThumb(dx, dragging){
      thumb.style.opacity = '1';
      thumb.classList.toggle('dragging', !!dragging);
      thumb.style.transform = `translateX(${dx}px)`;
      const g = geometry();
      let zone='neutral', icon='↔', bg='#21262d', bd='#30363d';
      if(dx >= g.perfectAt){ zone='perfect'; icon='✅'; bg='#0d2a1a'; bd='#58CC02'; }
      else if(dx >= g.okAt){ zone='ok'; icon='🟩'; bg='#1e2a15'; bd='#a3e635'; }
      thumb.textContent = icon;
      thumb.style.background = bg; thumb.style.borderColor = bd;
      return zone;
    }

    // Posición inicial: en reposo, neutral (sin candidatear nada -- el
    // fail ahora es el botón fijo de al lado, no parte de este gesto).
    const g0 = geometry();
    setThumb(g0.restAt, false);

    let startX=0, curDx=g0.restAt, lastZone='neutral', pointerId=null;

    track.addEventListener('pointerdown', (e)=>{
      pointerId = e.pointerId;
      try{ track.setPointerCapture(pointerId); }catch(e){ /* navegador raro sin soporte -- seguimos igual */ }
      const g = geometry();
      startX = e.clientX; curDx = g.restAt; lastZone='neutral';
      setThumb(g.restAt, true);
    });
    track.addEventListener('pointermove', (e)=>{
      if(e.pointerId !== pointerId) return;
      const g = geometry();
      let dx = g.restAt + (e.clientX - startX);
      const locked = track.dataset.locked === '1';
      // Bloqueo FÍSICO: si venció el timer, el tope derecho se recorta
      // antes de la zona "perfecto" -- por más que el dedo siga, el
      // thumb no la alcanza (no es solo un botón gris, no llega el gesto).
      const rightCap = locked ? (g.okAt + (g.perfectAt-g.okAt)*0.4) : g.maxOffset;
      dx = Math.max(g.restAt, Math.min(rightCap, dx));
      curDx = dx;
      const zone = setThumb(dx, true);
      if(zone !== lastZone){ hapticPulse(18); lastZone = zone; }
    });
    function endDrag(e){
      if(e.pointerId !== pointerId) return;
      pointerId = null;
      const g = geometry();
      const title = track.dataset.title;
      const checklistOk = track.dataset.checklistOk === '1';
      let estado = null;
      if(curDx >= g.perfectAt) estado = '✅';
      else if(curDx >= g.okAt) estado = '🟩';
      // Soltar en la zona neutral (sin llegar a ok) no dispara nada --
      // el thumb simplemente vuelve a reposo. Para fallar, está el botón
      // ❎ fijo al costado, ya no es parte de este gesto.

      if(estado === '✅' && !checklistOk){
        showToast('⚠️ Completá el checklist antes de marcar Perfecto');
        estado = null;
      }

      if(estado){
        hapticPulse(estado==='✅' ? [30,40,80] : 25);
        thumb.style.transition = 'transform .18s ease';
        setTimeout(()=>{
          thumb.style.transition = '';
          setThumb(g.restAt, false);
          openModal(title, estado);
        }, 180);
      } else {
        thumb.style.transition = 'transform .18s ease';
        setThumb(g.restAt, false);
        setTimeout(()=>{ thumb.style.transition=''; }, 180);
      }
      curDx = g.restAt; lastZone = 'neutral';
    }
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
  });

  document.querySelectorAll('.hslider-track[data-mode="auto"]').forEach(track=>{
    if(track.dataset.bound) return;
    track.dataset.bound = '1';
    const thumb = track.querySelector('.hslider-thumb');
    const preview = track.dataset.preview; // ✅ o 🟩, ya calculado en el render

    // Una sola zona: "sin confirmar" (reposo) vs "confirmado" (más allá
    // del umbral). El resultado (✅/🟩) NO depende de dónde soltás --
    // ya viene decidido por autoClassifyOutcome() en el render. Lo único
    // que la distancia extra cambia es la intensidad del haptic/pop al
    // soltar, como premio proporcional, puramente cosmético.
    function geometry(){
      const w = track.offsetWidth, tw = 40;
      const maxOffset = w - tw - 12;
      return { maxOffset, restAt: 0, confirmAt: 0.5*maxOffset };
    }
    function setThumb(dx, dragging, confirmed){
      thumb.style.opacity = '1';
      thumb.classList.toggle('dragging', !!dragging);
      thumb.style.transform = `translateX(${dx}px)`;
      if(confirmed){
        thumb.textContent = preview;
        thumb.style.background = preview==='✅' ? '#0d2a1a' : '#1e2a15';
        thumb.style.borderColor = preview==='✅' ? '#58CC02' : '#a3e635';
      } else {
        thumb.textContent = '○';
        thumb.style.background = '#21262d';
        thumb.style.borderColor = '#30363d';
      }
    }

    const g0 = geometry();
    setThumb(g0.restAt, false, false);

    let startX=0, curDx=g0.restAt, wasConfirmed=false, pointerId=null;

    track.addEventListener('pointerdown', (e)=>{
      pointerId = e.pointerId;
      try{ track.setPointerCapture(pointerId); }catch(e){}
      const g = geometry();
      startX = e.clientX; curDx = g.restAt; wasConfirmed = false;
      setThumb(g.restAt, true, false);
    });
    track.addEventListener('pointermove', (e)=>{
      if(e.pointerId !== pointerId) return;
      const g = geometry();
      let dx = Math.max(g.restAt, Math.min(g.maxOffset, g.restAt + (e.clientX - startX)));
      curDx = dx;
      const confirmed = dx >= g.confirmAt;
      setThumb(dx, true, confirmed);
      if(confirmed !== wasConfirmed){ hapticPulse(confirmed ? 22 : 12); wasConfirmed = confirmed; }
    });
    function endDrag(e){
      if(e.pointerId !== pointerId) return;
      pointerId = null;
      const g = geometry();
      const title = track.dataset.title;
      const confirmed = curDx >= g.confirmAt;

      if(confirmed){
        // premio proporcional a cuánto se pasó del umbral -- cosmético
        const intensity = Math.min(1, (curDx-g.confirmAt)/(g.maxOffset-g.confirmAt || 1));
        hapticPulse(preview==='✅' ? [30,40,Math.round(60+80*intensity)] : Math.round(20+15*intensity));
        thumb.style.transition = 'transform .18s ease';
        setTimeout(()=>{
          thumb.style.transition = '';
          setThumb(g.restAt, false, false);
          openModal(title, preview);
        }, 180);
      } else {
        thumb.style.transition = 'transform .18s ease';
        setThumb(g.restAt, false, false);
        setTimeout(()=>{ thumb.style.transition=''; }, 180);
      }
      curDx = g.restAt; wasConfirmed = false;
    }
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
  });
}


/* ================= Modal ================= */
function openModal(title, estado){
  // Respaldo: el slider ya se esconde solo (ver renderHabitSlider), pero
  // el timer emergente y el FAB "en curso ahora" también pueden llegar
  // acá directo -- este chequeo cubre esos caminos también.
  const habitCheck = STATE.data && STATE.data.habits.find(h=>h.title===title);
  if(habitCheck && !isDueToday(habitCheck)){
    showToast(`📅 "${title}" no toca hoy — próximo: ${nextDueLabel(habitCheck)}`);
    return;
  }
  STATE.pendingLog={title, estado};
  document.getElementById('modalTitle').textContent=title+' '+estado;
  document.getElementById('modalHint').textContent = 'Motivo obligatorio ej: CenaTarde';
  document.getElementById('modalInput').value='';
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalInput').focus();
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); STATE.pendingLog=null; }
document.getElementById('modalSave').onclick=()=>{
  const motivo=document.getElementById('modalInput').value.trim();
  const {title, estado}=STATE.pendingLog;
  if(!motivo){ alert('Motivo obligatorio, ej: CenaTarde'); return; }
  closeModal();

  enqueueLog(title, estado, motivo);
  renderTab();
  if(estado==='✅') launchConfetti();
  showToast(navigator.onLine===false ? '📴 Guardado local — se sincroniza al volver la señal' : '💾 Guardado, sincronizando...');
  trySync(true);
};
function launchConfetti(){
  for(let i=0;i<24;i++){ const d=document.createElement('div'); d.style.position='fixed'; d.style.left=(50+Math.random()*20-10)+'%'; d.style.top='50%'; d.style.width='8px'; d.style.height='8px'; d.style.background=PALETTE[i%PALETTE.length]; d.style.borderRadius='50%'; d.style.animation=`confetti ${0.6+Math.random()*0.4}s ease-out forwards`; d.style.zIndex='999'; document.body.appendChild(d); setTimeout(()=>d.remove(),1000); }
}

/* ================= PWA: registro de Service Worker ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

window.onload=load;
</script>
